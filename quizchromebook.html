<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chromebook - Antwoord</title>
  
  <!-- Firebase Compat SDK's -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  
  <script src="js/firebase-config.js"></script>
  <script src="js/quizchromebook.js"></script>

  <style>
    :root {
      --team-a-bg: #2563eb;
      --team-a-hover: #1d4ed8;
      --team-b-bg: #dc2626;
      --team-b-hover: #b91c1c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: #1e293b;
      padding: 1.25rem 2rem;
      text-align: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      z-index: 10;
    }

    .badge {
      display: inline-block;
      background: #38bdf8;
      color: #0f172a;
      font-weight: 800;
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 0.5rem;
    }

    .answer-display {
      font-size: 2rem;
      font-weight: 700;
      color: #f8fafc;
    }

    /* Massive Touch Zones */
    .button-container {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      padding: 1rem;
    }

    .btn-team {
      border: none;
      color: white;
      font-size: 2.2rem;
      font-weight: 900;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.15s ease;
      box-shadow: inset 0 -8px 0 rgba(0,0,0,0.25);
    }

    .btn-team-a {
      background-color: var(--team-a-bg);
    }
    .btn-team-a:hover:not(:disabled) {
      background-color: var(--team-a-hover);
    }

    .btn-team-b {
      background-color: var(--team-b-bg);
    }
    .btn-team-b:hover:not(:disabled) {
      background-color: var(--team-b-hover);
    }

    .btn-team:active:not(:disabled) {
      transform: translateY(4px);
      box-shadow: inset 0 -2px 0 rgba(0,0,0,0.25);
    }

    .btn-team:disabled {
      background-color: #334155 !important;
      color: #64748b !important;
      cursor: not-allowed;
      box-shadow: none;
      opacity: 0.6;
    }

    .sub-text {
      font-size: 1rem;
      font-weight: 500;
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <header>
    <div class="badge" id="optie-badge">Optie -</div>
    <div class="answer-display" id="antwoord-tekst">Aan het laden...</div>
  </header>

  <div class="button-container">
    <button id="knop-A" class="btn-team btn-team-a">
      <span>TEAM A</span>
      <span class="sub-text">DRUK HIER</span>
    </button>
    <button id="knop-B" class="btn-team btn-team-b">
      <span>TEAM B</span>
      <span class="sub-text">DRUK HIER</span>
    </button>
  </div>

  <script>
    // Lees de URL parameter uit (bijv. ?antwoord=A of ?antwoord=a)
    const urlParams = new URLSearchParams(window.location.search);
    const antwoordParam = urlParams.get('antwoord');

    if (antwoordParam) {
      const letter = antwoordParam.toUpperCase(); // Maak er een hoofdletter van (A, B, C of D)
      
      // Update de titel en badge op het scherm
      document.title = "Chromebook - Antwoord " + letter;
      document.getElementById('optie-badge').innerText = "Optie " + letter;
      
      // Koppel de logica uit chromebook.js met de gekozen letter
      koppelChromebook(letter);
    } else {
      document.getElementById('antwoord-tekst').innerText = "Fout: Geen URL parameter meegegeven! Gebruik ?antwoord=A";
    }
  </script>
</body>
</html>
