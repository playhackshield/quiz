<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chromebook - Antwoord</title>
  
  <!-- Firebase Compat SDK's -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  
  <script src="js/firebase-config.js"></script>
  <script src="js/chromebook.js"></script>

  <style>
    /* Antwoord Kleuren (matchen met het Digibord) */
    .kleur-A { background-color: #ef4444; color: white; }     /* Rood */
    .kleur-B { background-color: #22c55e; color: white; }     /* Groen */
    .kleur-C { background-color: #3b82f6; color: white; }     /* Blauw */
    .kleur-D { background-color: #facc15; color: #0f172a; }   /* Geel (met donkere tekst) */

    /* Basis styling voor de pagina (als fallback of tijdens laden) */
    .kleur-fallback { background-color: #1e293b; color: white; } 

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: #0f172a;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      padding: 2rem;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      z-index: 10;
      transition: background-color 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 35vh; /* Maakt de kleur lekker groot op het scherm */
    }

    .badge {
      display: inline-block;
      background: rgba(0, 0, 0, 0.2);
      font-weight: 800;
      padding: 0.5rem 1.5rem;
      border-radius: 30px;
      font-size: 1.2rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 1rem;
    }

    /* Zorgt dat de badge op de gele pagina ook een donkere rand/achtergrond krijgt */
    .kleur-D .badge {
      background: rgba(0, 0, 0, 0.1);
    }

    .answer-display {
      font-size: 2.5rem;
      font-weight: 800;
    }

    /* Neutrale team knoppen */
    .button-container {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      padding: 1rem;
    }

    .btn-team {
      border: none;
      color: white;
      font-size: 2.2rem;
      font-weight: 900;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.15s ease;
      box-shadow: inset 0 -8px 0 rgba(0,0,0,0.4);
    }

    /* Team A = Antraciet, Team B = Iets donkerder antraciet, zodat de focus op de header ligt */
    .btn-team-a {
      background-color: #334155; 
    }
    .btn-team-a:hover:not(:disabled) {
      background-color: #475569;
    }

    .btn-team-b {
      background-color: #1e293b;
    }
    .btn-team-b:hover:not(:disabled) {
      background-color: #334155;
    }

    .btn-team:active:not(:disabled) {
      transform: translateY(4px);
      box-shadow: inset 0 -2px 0 rgba(0,0,0,0.4);
    }

    .btn-team:disabled {
      background-color: #0f172a !important;
      color: #475569 !important;
      cursor: not-allowed;
      box-shadow: none;
      opacity: 0.5;
    }

    .sub-text {
      font-size: 1.2rem;
      font-weight: 500;
      opacity: 0.7;
    }
  </style>
</head>
<body>

  <!-- De header krijgt dynamisch de class .kleur-A, .kleur-B etc. -->
  <header id="main-header" class="kleur-fallback">
    <div class="badge" id="optie-badge">Optie -</div>
    <div class="answer-display" id="antwoord-tekst">Aan het laden...</div>
  </header>

  <div class="button-container">
    <button id="knop-A" class="btn-team btn-team-a">
      <span>TEAM A</span>
      <span class="sub-text">DRUK HIER</span>
    </button>
    <button id="knop-B" class="btn-team btn-team-b">
      <span>TEAM B</span>
      <span class="sub-text">DRUK HIER</span>
    </button>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const antwoordParam = urlParams.get('antwoord');

    if (antwoordParam) {
      const letter = antwoordParam.toUpperCase(); 
      
      // Update de teksten
      document.title = "Chromebook - Antwoord " + letter;
      document.getElementById('optie-badge').innerText = "Antwoord " + letter;
      
      // Update de KLEUR van de header
      const header = document.getElementById('main-header');
      header.classList.remove('kleur-fallback'); // Verwijder de standaardkleur
      
      if (['A', 'B', 'C', 'D'].includes(letter)) {
        header.classList.add('kleur-' + letter); // Voeg .kleur-A, -B, -C of -D toe
      } else {
        header.classList.add('kleur-fallback'); // Fallback als iemand ?antwoord=Z intypt
      }
      
      // Start logica
      koppelChromebook(letter);
    } else {
      document.getElementById('antwoord-tekst').innerText = "Fout: Gebruik ?antwoord=A in de adresbalk";
    }
  </script>
</body>
</html>
