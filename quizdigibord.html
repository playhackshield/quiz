<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Digibord - Quiz Server</title>
  <!-- Firebase Compat SDK's -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  
  <!-- App Scripts -->
  <script src="js/firebase-config.js"></script>
  <script src="js/quizdigibord.js" defer></script>
</head>
<body>
  <h1>Digibord Quiz Server</h1>

  <label for="vragenlijst">Kies vragenlijst:</label>
  <select id="vragenlijst">
    <option value="vragen1.json">Vragenlijst 1</option>
    <option value="vragen2.json">Vragenlijst 2</option>
  </select>
  <button onclick="startSessie()">Start Sessie</button>

  <hr>

  <div id="quiz-box" style="display:none;">
    <h2 id="emoji"></h2>
    <h2 id="vraag-tekst"></h2>
    
    <ol type="A">
      <li id="optie-A"></li>
      <li id="optie-B"></li>
      <li id="optie-C"></li>
      <li id="optie-D"></li>
    </ol>

    <p><strong>Status:</strong> <span id="status-tekst">Aan het wachten...</span></p>

    <button onclick="vorigeVraag()">Vorige Vraag</button>
    <button onclick="volgendeVraag()">Volgende Vraag</button>

    <h3>Scoreboard</h3>
    <p>Team A: <b id="score-A">0</b> punten</p>
    <p>Team B: <b id="score-B">0</b> punten</p>
  </div>
</body>
</html>
