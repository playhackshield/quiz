<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digibord - Quiz Master</title>

  <!-- Firebase Compat SDK's -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

  <script src="js/firebase-config.js"></script>
  <script src="js/server.js"></script>

  <style>
    :root {
      /* Identieke hex-codes als de Chromebook-pagina's */
      --color-a: #ef4444; /* Rood */
      --color-b: #22c55e; /* Groen */
      --color-c: #3b82f6; /* Blauw */
      --color-d: #facc15; /* Geel */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 1.5rem;
    }

    /* Bovenbalk met Vraag en Score */
    header {
      background-color: #1e293b;
      padding: 1.5rem 2rem;
      border-radius: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .question-box {
      flex: 1;
    }

    .question-title {
      font-size: 1.1rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
    }

    .question-text {
      font-size: 2rem;
      font-weight: 800;
      color: #f8fafc;
      margin-top: 0.25rem;
    }

    /* Scorebord op het scherm */
    .scoreboard {
      display: flex;
      gap: 1.5rem;
    }

    .team-score {
      padding: 0.75rem 1.5rem;
      border-radius: 12px;
      text-align: center;
      min-width: 130px;
      box-shadow: inset 0 -4px 0 rgba(0,0,0,0.2);
    }

    .score-a { background-color: #334155; border: 2px solid #475569; }
    .score-b { background-color: #1e293b; border: 2px solid #334155; }

    .team-label { font-size: 0.9rem; font-weight: 700; color: #94a3b8; }
    .score-value { font-size: 2rem; font-weight: 900; }

    /* 2x2 Grid voor de 4 Antwoordvakken */
    .answers-grid {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 1.5rem;
    }

    .answer-card {
      border-radius: 24px;
      padding: 2rem;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      position: relative;
      overflow: hidden;
      transition: transform 0.2s ease;
    }

    /* De opvallende antwoordletters A, B, C, D */
    .answer-letter {
      font-size: 3.5rem;
      font-weight: 900;
      background: rgba(0, 0, 0, 0.2);
      width: 90px;
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 20px;
      flex-shrink: 0;
    }

    .answer-content {
      font-size: 2.2rem;
      font-weight: 700;
      line-height: 1.2;
    }

    /* Kleurkoppelingen met de Chromebook-headers */
    .card-a { background-color: var(--color-a); color: white; }
    .card-b { background-color: var(--color-b); color: white; }
    .card-c { background-color: var(--color-c); color: white; }
    .card-d { background-color: var(--color-d); color: #0f172a; } /* Geel met donkere tekst */

    /* Geel vak heeft een iets lichtere achtergrond op de letter-badge */
    .card-d .answer-letter {
      background: rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body>

  <!-- Bovenbalk met actuele vraag & live score -->
  <header>
    <div class="question-box">
      <div class="question-title">Huidige Vraag</div>
      <div class="question-text" id="vraag-tekst">Aan het laden...</div>
    </div>

    <div class="scoreboard">
      <div class="team-score score-a">
        <div class="team-label">TEAM A</div>
        <div class="score-value" id="score-team-a">0</div>
      </div>
      <div class="team-score score-b">
        <div class="team-label">TEAM B</div>
        <div class="score-value" id="score-team-b">0</div>
      </div>
    </div>
  </header>

  <!-- Het 2x2 gekleurde antwoordengrid -->
  <main class="answers-grid">
    
    <div class="answer-card card-a">
      <div class="answer-letter">A</div>
      <div class="answer-content" id="tekst-a">Antwoord A laden...</div>
    </div>

    <div class="answer-card card-b">
      <div class="answer-letter">B</div>
      <div class="answer-content" id="tekst-b">Antwoord B laden...</div>
    </div>

    <div class="answer-card card-c">
      <div class="answer-letter">C</div>
      <div class="answer-content" id="tekst-c">Antwoord C laden...</div>
    </div>

    <div class="answer-card card-d">
      <div class="answer-letter">D</div>
      <div class="answer-content" id="tekst-d">Antwoord D laden...</div>
    </div>

  </main>

</body>
</html>
